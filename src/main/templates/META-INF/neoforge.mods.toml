modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
One item per metal: every ingot, nugget, raw ore, dust, sheet, block and ore that several mods add is replaced by
Haven Consolidated's, in recipes, loot, tags, storage and the world. Required on both sides.
'''

[[mixins]]
config="${mod_id}.mixins.json"

# Any NeoForge 21.1 (built against ${neo_version}; nothing newer is used, and the snapshot instance may lag the pack).
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
